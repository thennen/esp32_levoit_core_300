# Levoit Core 300 air purifier -> ESPHome / Home Assistant
# Board: Seeed Studio XIAO ESP32-C6
#
# Control:  emulates touch-button presses (Power, Speed) by switching a small
#           capacitor onto the capacitive touch pads with an NPN transistor.
# Feedback: reads the 5 V one-hot speed lines on the 6-pin header (J5)
#           through 18k/33k voltage dividers.
#
# XIAO pin map used here:
#   D2  = GPIO2   -> Power button emulator
#   D3  = GPIO21  -> Speed button emulator
#   D10 = GPIO18  <- Sleep speed line
#   D9  = GPIO20  <- Speed 1 line
#   D6  = GPIO16  <- Speed 2 line
#   D7  = GPIO17  <- Speed 3 line

esphome:
  name: levoit-core300
  friendly_name: Levoit Core 300

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

globals:
  - id: pending_presses
    type: int
    restore_value: false
    initial_value: '0'
  - id: go_to_speed_target
    type: int
    restore_value: false
    initial_value: '2'

output:
  # Power toggle (GPIO2)
  - platform: gpio
    pin: GPIO2
    id: power_toggle_out

  # Speed cycle (GPIO21)
  - platform: gpio
    pin: GPIO21
    id: speed_cycle_out

script:
  - id: press_power
    then:
      - output.turn_on: power_toggle_out
      - delay: 500ms
      - output.turn_off: power_toggle_out

  - id: press_speed_cycle
    then:
      - output.turn_on: speed_cycle_out
      - delay: 500ms
      - output.turn_off: speed_cycle_out

  # Presses "speed cycle" N times, 600ms apart, to walk from the
  # current speed to a target speed (1/2/3 cycles: 1->2->3->1).
  # Special-cases starting from Sleep: the first press from Sleep
  # always lands on Speed 1, regardless of target-relative math.
  - id: go_to_speed
    parameters:
      target: int
    then:
      - lambda: |-
          int current = 0; // 0=unknown/off, 1=sleep, 2/3/4 = speed 1/2/3
          if (id(state_sleep_speed).state) current = 1;
          else if (id(state_speed_1).state) current = 2;
          else if (id(state_speed_2).state) current = 3;
          else if (id(state_speed_3).state) current = 4;

          int presses = 0;
          if (current == 1) {
            presses = 1;
            int landed_on = 2; // Speed 1
            while (landed_on != target) {
              landed_on = (landed_on == 4) ? 2 : landed_on + 1;
              presses++;
            }
          } else if (current >= 2) {
            int landed_on = current;
            while (landed_on != target) {
              landed_on = (landed_on == 4) ? 2 : landed_on + 1;
              presses++;
            }
          } else {
            ESP_LOGW("fan", "Speed select: current state unknown, ignoring");
            return;
          }

          id(pending_presses) = presses;
      - while:
          condition:
            lambda: 'return id(pending_presses) > 0;'
          then:
            - script.execute: press_speed_cycle
            - delay: 600ms
            - lambda: 'id(pending_presses) -= 1;'

binary_sensor:
  # Raw state-read pins — hidden from dashboard, used only by the
  # combined text_sensor and switch/select logic below.
  # delayed_off: 500ms bridges the brief all-low blip that occurs
  # while the unit is transitioning between speeds, preventing
  # flicker to "unknown". During the overlap (old pin held + new
  # pin already high), the if/else chain shows the old state
  # briefly, then settles to the new state once delayed_off expires.
  - platform: gpio
    pin:
      number: GPIO18
      mode: INPUT
    name: "Sleep speed"
    id: state_sleep_speed
    internal: true
    filters:
      - delayed_off: 500ms

  - platform: gpio
    pin:
      number: GPIO20
      mode: INPUT
    name: "Speed 1"
    id: state_speed_1
    internal: true
    filters:
      - delayed_off: 500ms

  - platform: gpio
    pin:
      number: GPIO16
      mode: INPUT
    name: "Speed 2"
    id: state_speed_2
    internal: true
    filters:
      - delayed_off: 500ms

  - platform: gpio
    pin:
      number: GPIO17
      mode: INPUT
    name: "Speed 3"
    id: state_speed_3
    internal: true
    filters:
      - delayed_off: 500ms

text_sensor:
  - platform: template
    name: "Fan speed state"
    id: fan_speed_state
    update_interval: 1s
    lambda: |-
      if (id(state_sleep_speed).state) {
        return std::string("Sleep");
      } else if (id(state_speed_1).state) {
        return std::string("Speed 1");
      } else if (id(state_speed_2).state) {
        return std::string("Speed 2");
      } else if (id(state_speed_3).state) {
        return std::string("Speed 3");
      } else {
        return std::string("Off");
      }

switch:
  - platform: template
    name: "Power"
    id: power_switch
    optimistic: false
    lambda: |-
      return id(state_sleep_speed).state || id(state_speed_1).state ||
             id(state_speed_2).state || id(state_speed_3).state;
    turn_on_action:
      - script.execute: press_power
    turn_off_action:
      - script.execute: press_power

select:
  - platform: template
    name: "Speed"
    id: speed_select
    optimistic: false
    update_interval: 1s
    options:
      - "Speed 1"
      - "Speed 2"
      - "Speed 3"
    lambda: |-
      if (id(state_speed_1).state) return std::string("Speed 1");
      else if (id(state_speed_2).state) return std::string("Speed 2");
      else if (id(state_speed_3).state) return std::string("Speed 3");
      else return {};
    set_action:
      - lambda: |-
          // x is a StringRef; assign to std::string for safe comparison
          std::string selected = x;
          int target = 2;
          if (selected == "Speed 1") target = 2;
          else if (selected == "Speed 2") target = 3;
          else if (selected == "Speed 3") target = 4;
          id(go_to_speed_target) = target;
      - script.execute:
          id: go_to_speed
          target: !lambda 'return id(go_to_speed_target);'

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Levoit-Core300 Fallback"
    password: !secret fallback_ap_password

captive_portal:
